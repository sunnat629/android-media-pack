name: ci

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md"

  skill-checks:
    name: Skill frontmatter and size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter
        run: bash scripts/check-skill-frontmatter.sh
      - name: Enforce SKILL.md size budget
        run: bash scripts/check-skill-size.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck bin/android-media-skill scripts/*.sh run-sample-app.sh
